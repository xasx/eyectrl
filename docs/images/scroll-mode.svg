<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="880" height="430" rx="14" fill="#12121F"/>
  <text x="440" y="30" fill="#D6DEF5" font-size="16" text-anchor="middle" font-weight="600">Scroll mode — your gaze is the joystick</text>

  <!-- Anchor assembly -->
  <!-- Start circle: hold gaze here ~0.15 s to arm scrolling (much wider than the ring) -->
  <circle cx="330" cy="220" r="150" fill="none" stroke="#3E3E64" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="330" y="56" fill="#868FB5" font-size="11" text-anchor="middle">start circle — hold your gaze here briefly to arm scrolling</text>
  <circle cx="330" cy="220" r="96" fill="#1A1A2E" stroke="#3E3E64" stroke-width="2"/>
  <!-- velocity ring: thick accent arc = speed -->
  <path d="M 330 124 A 96 96 0 0 1 413 172" fill="none" stroke="#A5F3FC" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330" cy="220" r="96" fill="none" stroke="#3E3E64" stroke-width="2"/>
  <!-- dead zone -->
  <circle cx="330" cy="220" r="30" fill="none" stroke="#616BA0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- crosshair -->
  <line x1="212" y1="220" x2="292" y2="220" stroke="#D6DEF5" stroke-width="1.5" opacity="0.7"/>
  <line x1="368" y1="220" x2="448" y2="220" stroke="#D6DEF5" stroke-width="1.5" opacity="0.7"/>
  <line x1="330" y1="102" x2="330" y2="182" stroke="#D6DEF5" stroke-width="1.5" opacity="0.7"/>
  <line x1="330" y1="258" x2="330" y2="338" stroke="#D6DEF5" stroke-width="1.5" opacity="0.7"/>
  <circle cx="330" cy="220" r="5" fill="#D6DEF5"/>

  <text x="330" y="348" fill="#9AA4C8" font-size="12" text-anchor="middle">anchor = where you opened the menu</text>
  <text x="330" y="364" fill="#868FB5" font-size="11" text-anchor="middle">look back here to stop (dashed inner ring = dead zone); scrolling arms only after</text>
  <text x="330" y="377" fill="#868FB5" font-size="11" text-anchor="middle">you hold inside the wide start circle for a fraction of a second</text>

  <!-- gaze dot offset up-right -->
  <circle cx="470" cy="120" r="13" fill="#2A2A44" stroke="#A5F3FC" stroke-width="3"/>
  <circle cx="470" cy="120" r="4" fill="#A5F3FC"/>
  <text x="492" y="112" fill="#D6DEF5" font-size="12.5">your gaze dot</text>
  <path d="M 402 159 L 442 132" stroke="#A5F3FC" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 444 142 L 448 128 L 434 132 Z" fill="#A5F3FC"/>

  <!-- direction annotation -->
  <path d="M 470 96 C 500 60, 560 52, 606 62" fill="none" stroke="#868FB5" stroke-width="1.5"/>
  <path d="M 598 54 L 612 64 L 596 70 Z" fill="#868FB5"/>
  <text x="622" y="60" fill="#D6DEF5" font-size="12.5">scrolls this way</text>
  <text x="622" y="77" fill="#868FB5" font-size="11">the farther the dot from the anchor, the faster</text>

  <!-- ring thickness annotation -->
  <path d="M 396 130 C 430 96, 480 84, 520 92" fill="none" stroke="#868FB5" stroke-width="1.5"/>
  <text x="524" y="86" fill="#D6DEF5" font-size="12.5">ring thickens with speed</text>

  <!-- Stop button -->
  <circle cx="800" cy="220" r="28" fill="#2A2A3E" stroke="#616BA0"/>
  <rect x="788" y="208" width="24" height="24" rx="4" fill="#D6DEF5"/>
  <text x="800" y="270" fill="#9AA4C8" font-size="11.5" text-anchor="middle">&#9209; Stop button</text>
  <text x="800" y="285" fill="#868FB5" font-size="10.5" text-anchor="middle">right screen edge</text>

  <text x="440" y="404" fill="#868FB5" font-size="11.5" text-anchor="middle" font-style="italic">Leave scroll mode: dwell the Stop button, press Esc, or look away from the screen for ~2 s.</text>
</svg>
