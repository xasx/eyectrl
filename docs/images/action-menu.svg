<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="880" height="560" rx="14" fill="#12121F"/>
  <text x="440" y="30" fill="#D6DEF5" font-size="16" text-anchor="middle" font-weight="600">The action menu — first ring layer, edge buttons, second layer</text>

  <!-- Left edge: modifier latches -->
  <text x="70" y="70" fill="#9AA4C8" font-size="12" text-anchor="middle">left screen edge</text>
  <circle cx="70" cy="110" r="24" fill="#3E3E64" stroke="#616BA0"/>
  <text x="70" y="115" fill="#D6DEF5" font-size="11.5" text-anchor="middle">Shift</text>
  <circle cx="70" cy="164" r="24" fill="#3E3E64" stroke="#616BA0"/>
  <text x="70" y="169" fill="#D6DEF5" font-size="11.5" text-anchor="middle">Ctrl</text>
  <circle cx="70" cy="218" r="24" fill="#3E3E64" stroke="#616BA0"/>
  <text x="70" y="223" fill="#D6DEF5" font-size="11.5" text-anchor="middle">Alt</text>
  <text x="70" y="262" fill="#868FB5" font-size="10.5" text-anchor="middle">latch for the</text>
  <text x="70" y="275" fill="#868FB5" font-size="10.5" text-anchor="middle">next click</text>

  <!-- Ring: dashed guide circle, 5 nodes at 72 deg spacing -->
  <circle cx="440" cy="190" r="120" fill="none" stroke="#3E3E64" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="440" y="60" fill="#9AA4C8" font-size="12" text-anchor="middle">opens at the screen center by default (Settings &#8594; Layout: At Gaze)</text>

  <!-- nodes: top, then clockwise -->
  <circle cx="440" cy="70"  r="34" fill="#2A2A3E" stroke="#A5F3FC" stroke-width="2"/>
  <text x="440" y="68" fill="#D6DEF5" font-size="11" text-anchor="middle">Left</text>
  <text x="440" y="81" fill="#D6DEF5" font-size="11" text-anchor="middle">click</text>

  <circle cx="554" cy="153" r="34" fill="#2A2A3E" stroke="#616BA0"/>
  <text x="554" y="151" fill="#D6DEF5" font-size="11" text-anchor="middle">Right</text>
  <text x="554" y="164" fill="#D6DEF5" font-size="11" text-anchor="middle">click</text>

  <circle cx="510" cy="275" r="34" fill="#2A2A3E" stroke="#616BA0"/>
  <text x="510" y="273" fill="#D6DEF5" font-size="11" text-anchor="middle">Double</text>
  <text x="510" y="286" fill="#D6DEF5" font-size="11" text-anchor="middle">click</text>

  <circle cx="370" cy="275" r="34" fill="#2A2A3E" stroke="#616BA0"/>
  <text x="370" y="273" fill="#D6DEF5" font-size="11" text-anchor="middle">Scroll</text>
  <text x="370" y="286" fill="#D6DEF5" font-size="11" text-anchor="middle">mode</text>

  <circle cx="326" cy="153" r="34" fill="#2A2A44" stroke="#A5F3FC" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="326" y="158" fill="#A5F3FC" font-size="12" text-anchor="middle">More &#8594;</text>

  <!-- Right edge: close + help -->
  <text x="810" y="70" fill="#9AA4C8" font-size="12" text-anchor="middle">right screen edge</text>
  <circle cx="810" cy="110" r="24" fill="#2A2A3E" stroke="#616BA0"/>
  <text x="810" y="116" fill="#D6DEF5" font-size="14" text-anchor="middle">&#10005;</text>
  <text x="810" y="148" fill="#868FB5" font-size="10.5" text-anchor="middle">close</text>
  <circle cx="810" cy="192" r="24" fill="#2A2A3E" stroke="#616BA0"/>
  <text x="810" y="198" fill="#D6DEF5" font-size="14" text-anchor="middle">?</text>
  <text x="810" y="230" fill="#868FB5" font-size="10.5" text-anchor="middle">show ring</text>
  <text x="810" y="243" fill="#868FB5" font-size="10.5" text-anchor="middle">labels</text>

  <!-- Second layer -->
  <text x="440" y="360" fill="#9AA4C8" font-size="12.5" text-anchor="middle">after dwelling <tspan fill="#A5F3FC" font-weight="600">More</tspan> &#8212; the second layer (shown flat here; it lives on the same ring):</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="100"  y="380" width="108" height="34" rx="8" fill="#2A2A3E" stroke="#616BA0"/>
    <text x="154" y="401" fill="#D6DEF5">Drag</text>
    <rect x="222" y="380" width="108" height="34" rx="8" fill="#2A2A3E" stroke="#616BA0"/>
    <text x="276" y="401" fill="#D6DEF5">Scroll up</text>
    <rect x="344" y="380" width="108" height="34" rx="8" fill="#2A2A3E" stroke="#616BA0"/>
    <text x="398" y="401" fill="#D6DEF5">Scroll down</text>
    <rect x="466" y="380" width="108" height="34" rx="8" fill="#2A2A3E" stroke="#616BA0"/>
    <text x="520" y="401" fill="#D6DEF5">Pin note</text>
    <rect x="588" y="380" width="108" height="34" rx="8" fill="#2A2A3E" stroke="#616BA0"/>
    <text x="642" y="401" fill="#D6DEF5">Keyboard</text>
    <rect x="710" y="380" width="86" height="34" rx="8" fill="#2A2A44" stroke="#A5F3FC" stroke-dasharray="4 3"/>
    <text x="753" y="401" fill="#A5F3FC">&#8592; Back</text>
  </g>
  <text x="440" y="452" fill="#868FB5" font-size="11.5" text-anchor="middle">Middle click, Scroll left and Scroll right are available too &#8212;</text>
  <text x="440" y="467" fill="#868FB5" font-size="11.5" text-anchor="middle">turn them on and arrange both layers in Settings &#8594; Action Menu (max 4 on the first layer).</text>

  <text x="440" y="505" fill="#9AA4C8" font-size="11.5" text-anchor="middle" font-style="italic">Schematic (not a screenshot) &#8212; labels are normally shown only while you dwell an item.</text>
</svg>
