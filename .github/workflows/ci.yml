name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately the first thing after checkout, ahead of the WinUI provisioning and the
      # build. The palette gates take about a second, need nothing from .NET, and a failure here
      # means a shipped theme is unreadable — so it should not wait several minutes behind a
      # build to say so.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tools/palette_validate.py runs ten gates over all three themes (Midnight, Ember, Contrast):
      # WCAG contrast, CIEDE2000 separation, Vienot dichromat simulation, and a non-colour tail
      # covering the radius ramp, the type ramp and the 12px legibility floor.
      #
      # This is NOT redundant with `dotnet test`, and the distinction is the whole reason for the
      # step. Several Controls tests (ThemeParityTests, LegibilityFloorTests) already parse this
      # file and assert the C# tokens carry the same VALUES — so C#/Python drift is caught. What no
      # test does is run the gates themselves: whether those values are actually readable. A theme
      # edit that moved both languages in step would sail through the suite while shipping text a
      # user cannot see. Until now the gates ran only when somebody remembered, which is not a gate.
      #
      # Stdlib only, by design (see the script's docstring), so there is nothing to install.
      - name: Validate theme palettes
        run: python tools/palette_validate.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision WinUI AppxPackage tooling at the path the build probes
        shell: pwsh
        run: |
          # WindowsAppSDK's PRI target resolves its AppxPackage MSBuild task to a VS "Insiders"
          # path that isn't installed on the runner (only VS Enterprise is), and env overrides
          # (VSINSTALLDIR / VsInstallRoot) don't move it. So copy the real AppxPackage tooling
          # to the exact path the build looks for.
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter 'Microsoft.Build.Packaging.Pri.Tasks.dll' -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'v18\.0\\AppxPackage' } | Select-Object -First 1
          if (-not $dll) { throw "Could not locate VS v18.0 AppxPackage tooling on the runner" }
          $srcDir = Split-Path $dll.FullName
          $dstDir = 'C:\Program Files\Microsoft Visual Studio\18\Insiders\MSBuild\Microsoft\VisualStudio\v18.0\AppxPackage'
          Write-Host "Mirroring $srcDir -> $dstDir"
          New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
          Copy-Item -Path (Join-Path $srcDir '*') -Destination $dstDir -Recurse -Force
          if (-not (Test-Path (Join-Path $dstDir 'Microsoft.Build.Packaging.Pri.Tasks.dll'))) {
            throw "Failed to place PRI task DLL at $dstDir"
          }
          Write-Host "PRI task DLL present at $dstDir"

      - name: Build
        run: dotnet build EyeCtrl.slnx

      - name: Run unit tests
        run: dotnet test --filter "Category!=UI" --no-build

      - name: Run generator tests (benchmark correctness)
        run: dotnet test tests/EyeCtrl.Benchmarks.Tests
